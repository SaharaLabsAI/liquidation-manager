# Liquidity monitor configuration for the testnet drill deployment (script/testnet/deployments/). Run from monitor/,
# with TELEGRAM_BOT_TOKEN and TELEGRAM_CHANNEL_ID (a test bot and channel) in monitor/.env:
#   node --env-file=.env src/cli.ts check --config ../script/testnet/monitor/config.yaml
# MTK stands in for SAHARA: 1,000,000 supply on each chain, so requiredBacking is one chain's supply. The deployer holds
# the reserves outside the Manager and is listed as the legacy wallet.

logLevel: info
stateFile: ./state/testnet.json

http:
  port: 9465

token:
  symbol: MTK
  decimals: 18

alerts:
  reminderSec: # shorter than production, so the live test sees reminders
    critical: 1800
    high: 3600
    warning: 7200
    info: 0
  dailySummaryUtc: "01:00"

telegram:
  botToken: ${TELEGRAM_BOT_TOKEN}
  routes:
    - chatId: ${TELEGRAM_CHANNEL_ID}
      minSeverity: info

reconciliation:
  enabled: true
  requiredBacking: "1000000"
  intervalSec: 120

chains:
  bsc-testnet:
    chainId: 97
    chainSelector: "13264668187771770619"
    rpcUrls: ["${BSC_TESTNET_RPC_URL:-https://bsc-testnet-rpc.publicnode.com}"]
