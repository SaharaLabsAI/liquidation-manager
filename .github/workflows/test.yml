name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: ci

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          # Pinned: `stable` drifts, and newer forge fmt releases reformat the code.
          version: v1.2.3

      - name: Show Forge version
        run: |
          forge --version

      - name: Run Forge fmt
        run: |
          forge fmt --check
        id: fmt

      - name: Check contract sizes
        run: |
          forge build src --sizes
        id: build

      - name: Run Forge tests
        run: |
          forge test -vvv
        id: test

  monitor:
    name: Monitor (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: monitor
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          # Pinned: `stable` drifts, and newer forge fmt releases reformat the code.
          version: v1.2.3

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: monitor/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check generated ABIs match the contracts
        run: |
          forge build --root ..
          npm run gen:abi
          git diff --exit-code src/abi/generated.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: End-to-end tests (anvil)
        run: npm run test:e2e

  fork:
    name: Fork tests (Ethereum and BSC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          # Pinned: `stable` drifts, and newer forge fmt releases reformat the code.
          version: v1.2.3

      - name: Run fork tests
        env:
          # The fork suites cap their own fuzz runs under the default profile; keep RPC load low.
          FOUNDRY_PROFILE: default
          RUN_FORK_TESTS: "true"
          ETH_RPC_SECRET: ${{ secrets.ETH_RPC_URL }}
          BSC_RPC_SECRET: ${{ secrets.BSC_RPC_URL }}
        run: |
          export ETH_RPC_URL="${ETH_RPC_SECRET:-https://ethereum-rpc.publicnode.com}"
          export BSC_RPC_URL="${BSC_RPC_SECRET:-https://bsc-dataseed.bnbchain.org}"
          forge test --match-path 'test/fork/*' -vvv
          forge test --match-path 'test/controller-timelock/ForkLockdown.t.sol' -vvv
